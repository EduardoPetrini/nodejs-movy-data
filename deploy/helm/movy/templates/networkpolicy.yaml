{{- if .Values.networkPolicy.enabled }}
# Runner pods accept no connections. Their health port is for the kubelet,
# whose probes come from the node and are not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "movy.fullname" . }}-runner
  labels: {{- include "movy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "movy.selector" (dict "root" $ "component" "runner") | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
{{- end }}
