{{- /*
Every secret value is settled here, once, because several Secrets share them:
the encryption key is the console's and the runners', a role's password is in
its own Secret and inside a URL. Each value is the one given in values, else
the one this release already stored (`movy.keep`), else fresh.

`helm.sh/resource-policy: keep`: an uninstall leaves them, so a re-install
finds the same key and the same meta-db password the volume was created with.
*/ -}}
{{- include "movy.validateClasses" . -}}
{{- $ns := .Release.Namespace -}}
{{- $movyName := include "movy.secret.movy" . -}}
{{- $runnerName := include "movy.secret.runner" . -}}
{{- $scalerName := include "movy.secret.scaler" . -}}
{{- $metaName := include "movy.secret.metaDb" . -}}
{{- $labName := include "movy.secret.lab" . -}}
{{- $m := .Values.metaDb -}}
{{- $host := include "movy.metaDb.host" . -}}

{{- $key := include "movy.keep" (dict "ns" $ns "name" $movyName "key" "NUXT_ENCRYPTION_KEY" "given" .Values.secrets.encryptionKey "fresh" (randBytes 32)) -}}
{{- $session := include "movy.keep" (dict "ns" $ns "name" $movyName "key" "NUXT_SESSION_PASSWORD" "given" .Values.secrets.sessionPassword "fresh" (randAlphaNum 64)) -}}
{{- /* An external meta-db's password cannot be invented: it is that server's. */ -}}
{{- $metaPw := include "movy.keep" (dict "ns" $ns "name" $metaName "key" "POSTGRES_PASSWORD" "given" $m.password "fresh" (ternary (randAlphaNum 32) "" $m.bundled)) -}}
{{- if not $metaPw }}{{ fail "metaDb.password is required for an external meta-db (metaDb.bundled: false)" }}{{ end -}}
{{- $runnerPw := include "movy.keep" (dict "ns" $ns "name" $runnerName "key" "RUNNER_DB_PASSWORD" "given" .Values.secrets.runnerDbPassword "fresh" (randAlphaNum 32)) -}}

{{- $at := printf "%s:%v/%s%s" $host $m.port $m.database ($m.params | default "") -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $movyName }}
  labels: {{- include "movy.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  # The meta-db's owner. Never mounted into a runner pod.
  NUXT_DATABASE_URL: {{ printf "postgres://%s:%s@%s" (urlquery $m.username) (urlquery $metaPw) $at | quote }}
  # Encrypts saved connection passwords and seals every run spec. Regenerating
  # it makes every saved connection undecryptable.
  NUXT_ENCRYPTION_KEY: {{ $key | quote }}
  # Seals the session cookie. Rotating it signs everyone out.
  NUXT_SESSION_PASSWORD: {{ $session | quote }}
  {{- with .Values.web.oauth.google }}
  {{- if .clientId }}
  NUXT_OAUTH_GOOGLE_CLIENT_ID: {{ .clientId | quote }}
  NUXT_OAUTH_GOOGLE_CLIENT_SECRET: {{ required "web.oauth.google.clientSecret is required with a clientId" .clientSecret | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runnerName }}
  labels: {{- include "movy.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  # migrate creates the movy_runner role (or resets its password) from this.
  RUNNER_DB_PASSWORD: {{ $runnerPw | quote }}
  # The queue, run events and progress, the runners table. No access to
  # connections, users or organizations.
  MOVY_DATABASE_URL: {{ printf "postgres://movy_runner:%s@%s" (urlquery $runnerPw) $at | quote }}
  # Must equal the console's: a runner with another key fails every run it claims.
  MOVY_ENCRYPTION_KEY: {{ $key | quote }}
{{- if include "movy.jobClasses" . }}
{{- $scalerPw := include "movy.keep" (dict "ns" $ns "name" $scalerName "key" "SCALER_DB_PASSWORD" "given" .Values.secrets.scalerDbPassword "fresh" (randAlphaNum 32)) }}
{{- /* KEDA's operator runs in its own namespace: a bare Service name would not resolve there. */ -}}
{{- $scalerHost := ternary (printf "%s.%s.svc" $host $ns) $host $m.bundled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $scalerName }}
  labels: {{- include "movy.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  # migrate creates movy_scaler from this: SELECT on runner_demand, nothing else.
  SCALER_DB_PASSWORD: {{ $scalerPw | quote }}
  # What KEDA's postgresql trigger connects with (scaler-auth.yaml).
  connection: {{ printf "postgresql://movy_scaler:%s@%s:%v/%s%s" (urlquery $scalerPw) $scalerHost $m.port $m.database ($m.params | default "") | quote }}
{{- end }}
{{- if $m.bundled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $metaName }}
  labels: {{- include "movy.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  # The bundled meta-db's superuser. Must match the volume it initialised.
  POSTGRES_PASSWORD: {{ $metaPw | quote }}
{{- end }}
{{- if .Values.lab.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $labName }}
  labels: {{- include "movy.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Each key is the name its database image reads, and seed-lab.ts reads the
  # same keys to save the matching connections.
  POSTGRES_PASSWORD: {{ include "movy.keep" (dict "ns" $ns "name" $labName "key" "POSTGRES_PASSWORD" "given" "" "fresh" (randAlphaNum 24)) | quote }}
  MYSQL_ROOT_PASSWORD: {{ include "movy.keep" (dict "ns" $ns "name" $labName "key" "MYSQL_ROOT_PASSWORD" "given" "" "fresh" (randAlphaNum 24)) | quote }}
  # SQL Server's policy: upper, lower, digit and symbol.
  MSSQL_SA_PASSWORD: {{ include "movy.keep" (dict "ns" $ns "name" $labName "key" "MSSQL_SA_PASSWORD" "given" "" "fresh" (printf "Mv1-%s" (randAlphaNum 24))) | quote }}
{{- end }}
